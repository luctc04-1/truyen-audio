<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Badge Container -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#111113" stroke="url(#grad-primary)" stroke-width="6" />

  <!-- Headphone Arc -->
  <path d="M 128 256 A 128 128 0 0 1 384 256" fill="none" stroke="url(#grad-primary)" stroke-width="32" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 112 256 C 112 176 176 112 256 112 C 336 112 400 176 400 256" fill="none" stroke="url(#grad-glow)" stroke-width="12" stroke-linecap="round" />

  <!-- Earcups -->
  <rect x="96" y="240" width="40" height="96" rx="20" fill="url(#grad-primary)" />
  <rect x="376" y="240" width="40" height="96" rx="20" fill="url(#grad-primary)" />

  <!-- Book & Soundwave Icon Center -->
  <path d="M 256 220 L 200 240 L 200 340 L 256 320 L 312 340 L 312 240 Z" fill="none" stroke="#ffffff" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M 256 220 L 256 320" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />

  <!-- Audio Waves -->
  <line x1="220" y1="365" x2="220" y2="395" stroke="url(#grad-primary)" stroke-width="8" stroke-linecap="round" />
  <line x1="244" y1="355" x2="244" y2="405" stroke="url(#grad-primary)" stroke-width="8" stroke-linecap="round" />
  <line x1="268" y1="355" x2="268" y2="405" stroke="url(#grad-primary)" stroke-width="8" stroke-linecap="round" />
  <line x1="292" y1="365" x2="292" y2="395" stroke="url(#grad-primary)" stroke-width="8" stroke-linecap="round" />
</svg>
