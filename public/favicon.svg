  <line x1="210" y1="375" x2="210" y2="415" stroke="url(#fav-grad)" stroke-width="10" stroke-linecap="round" />
  <line x1="240" y1="360" x2="240" y2="430" stroke="url(#fav-grad)" stroke-width="10" stroke-linecap="round" />
  <line x1="272" y1="360" x2="272" y2="430" stroke="url(#fav-grad)" stroke-width="10" stroke-linecap="round" />
